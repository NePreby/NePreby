<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" width="100%" height="370">
  <defs>
    <linearGradient id="term-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <style>
    .cursor { animation: blink 1s infinite steps(1); }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .t-cyan { fill: #38bdf8; font-weight: 700; }
    .t-purple { fill: #c084fc; font-weight: 700; }
    .t-green { fill: #34d399; font-weight: 600; }
    .t-yellow { fill: #fbbf24; font-weight: 600; }
    .t-pink { fill: #f472b6; font-weight: 600; }
    .t-white { fill: #f1f5f9; }
    .t-gray { fill: #64748b; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, Menlo, Monaco, monospace; font-size: 13.5px; }
  </style>

  <!-- Terminal Window Outer Frame -->
  <rect width="938" height="368" x="1" y="1" rx="16" fill="#070b14" stroke="url(#term-border)" stroke-width="1.8"/>

  <!-- Window Header Bar -->
  <path d="M 1 16 C 1 7.2 7.2 1 16 1 L 924 1 C 932.8 1 939 7.2 939 16 L 939 42 L 1 42 Z" fill="url(#term-header)" stroke="#334155" stroke-width="0.8"/>

  <!-- Mac Buttons -->
  <circle cx="26" cy="21" r="6" fill="#ef4444" />
  <circle cx="46" cy="21" r="6" fill="#f59e0b" />
  <circle cx="66" cy="21" r="6" fill="#10b981" />

  <!-- Terminal Title -->
  <text x="470" y="25" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">
    hao@cloud-edge: ~/profile-system --environment=production
  </text>

  <!-- Command Line Execution -->
  <g transform="translate(32, 74)" class="mono">
    <!-- Prompt Line -->
    <text x="0" y="0">
      <tspan class="t-green">hao@cloud-edge</tspan><tspan class="t-gray">:</tspan><tspan class="t-cyan">~/developer-portfolio</tspan><tspan class="t-pink">$</tspan>
      <tspan class="t-white"> neofetch --profile --deep-inspect</tspan>
    </text>

    <!-- Terminal Output -->
    <g transform="translate(0, 26)">
      <text x="0" y="0"><tspan class="t-cyan">▸ Engineer Identity :</tspan> <tspan class="t-white">Nguyen Quoc Hao (NePreby)</tspan> <tspan class="t-green">[Core Open-Source Contributor]</tspan></text>
      <text x="0" y="24"><tspan class="t-cyan">▸ Professional Role :</tspan> <tspan class="t-purple">Full-Stack Software Engineer &amp; AI Systems Architect</tspan></text>
      <text x="0" y="48"><tspan class="t-cyan">▸ Core Languages    :</tspan> <tspan class="t-yellow">Python 3.12</tspan><tspan class="t-gray">, </tspan><tspan class="t-yellow">TypeScript</tspan><tspan class="t-gray">, </tspan><tspan class="t-yellow">Go (Golang)</tspan><tspan class="t-gray">, </tspan><tspan class="t-yellow">Rust</tspan><tspan class="t-gray">, </tspan><tspan class="t-yellow">SQL (PostgreSQL)</tspan></text>
      <text x="0" y="72"><tspan class="t-cyan">▸ Web &amp; Backend     :</tspan> <tspan class="t-green">FastAPI, Node.js, Express, React 19, Next.js, TailwindCSS, Django</tspan></text>
      <text x="0" y="96"><tspan class="t-cyan">▸ Automation &amp; AI   :</tspan> <tspan class="t-pink">Playwright Headless, Autonomous Multi-Agents, LangChain, AST Refactoring</tspan></text>
      <text x="0" y="120"><tspan class="t-cyan">▸ Cloud &amp; Protocol  :</tspan> <tspan class="t-white">Docker, PostgreSQL, Redis, Supabase, Linux Ubuntu, GitHub Actions CI/CD</tspan></text>
      <text x="0" y="144"><tspan class="t-cyan">▸ Open-Source Core  :</tspan> <tspan class="t-yellow">76+ Verified Production PRs</tspan><tspan class="t-gray"> | </tspan><tspan class="t-green">100% Hermetic Test Pass Rate</tspan></text>
      <text x="0" y="168"><tspan class="t-cyan">▸ Architecture Core :</tspan> <tspan class="t-green">Zero Silent Fallbacks, Multi-Tenant Data Isolation, Resilient APIs</tspan></text>
      <text x="0" y="192"><tspan class="t-cyan">▸ Availability      :</tspan> <tspan class="t-purple">Open for High-Impact Software Engineering Roles &amp; Remote Contracts</tspan></text>
      <text x="0" y="222">
        <tspan class="t-green">hao@cloud-edge</tspan><tspan class="t-gray">:</tspan><tspan class="t-cyan">~/developer-portfolio</tspan><tspan class="t-pink">$</tspan>
        <tspan class="t-white"> ping -c 1 global-collaborations</tspan>
        <tspan class="t-green"> [ONLINE 24/7]</tspan>
        <tspan class="cursor t-cyan"> ▌</tspan>
      </text>
    </g>
  </g>
</svg>
