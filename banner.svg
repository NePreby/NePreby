<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Flowing Title Gradient with Animation -->
    <linearGradient id="glow-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#ec4899;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#ec4899;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#38bdf8;#a855f7;#f472b6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#ec4899;#3b82f6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#3b82f6;#8b5cf6;#10b981" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .star { animation: twinkle 3s infinite ease-in-out; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50% { opacity: 0.85; transform: scale(1.3); }
    }
    .badge-pulse { animation: breathe 2s infinite ease-in-out; }
    @keyframes breathe {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
    }
    .scan-beam { animation: scan 7s infinite linear; }
    @keyframes scan {
      0% { transform: translateX(-100px); opacity: 0; }
      20% { opacity: 0.4; }
      80% { opacity: 0.4; }
      100% { transform: translateX(1020px); opacity: 0; }
    }
  </style>

  <!-- Base Card -->
  <rect width="918" height="238" x="1" y="1" rx="18" fill="url(#bg)" stroke="url(#border-glow)" stroke-width="2"/>

  <!-- Scanning Light Beam Effect -->
  <g class="scan-beam">
    <rect x="0" y="2" width="80" height="236" fill="url(#glow-text)" opacity="0.08" transform="skewX(-25)"/>
  </g>

  <!-- Constellation Ambient Tech Particles -->
  <g fill="#93c5fd">
    <circle cx="45" cy="45" r="2" class="star" style="animation-delay: 0s;"/>
    <circle cx="95" cy="35" r="1.5" class="star" style="animation-delay: 0.8s;"/>
    <circle cx="140" cy="55" r="2.5" class="star" style="animation-delay: 1.6s;"/>
    <circle cx="65" cy="95" r="1.5" class="star" style="animation-delay: 2.2s;"/>
    <circle cx="120" cy="115" r="2" class="star" style="animation-delay: 1.1s;"/>
    
    <circle cx="875" cy="45" r="2" class="star" style="animation-delay: 0.5s;"/>
    <circle cx="825" cy="35" r="1.5" class="star" style="animation-delay: 1.3s;"/>
    <circle cx="780" cy="65" r="2.5" class="star" style="animation-delay: 2.1s;"/>
    <circle cx="850" cy="100" r="1.5" class="star" style="animation-delay: 0.9s;"/>
    <circle cx="800" cy="125" r="2" class="star" style="animation-delay: 1.7s;"/>
  </g>

  <!-- Connecting Lines -->
  <path d="M 45 45 L 95 35 L 140 55 M 65 95 L 120 115" stroke="#38bdf8" stroke-width="0.8" opacity="0.25"/>
  <path d="M 875 45 L 825 35 L 780 65 M 850 100 L 800 125" stroke="#a855f7" stroke-width="0.8" opacity="0.25"/>

  <!-- Status Capsule Badge -->
  <g transform="translate(290, 26)">
    <rect width="340" height="28" rx="14" fill="#0f172a" stroke="#4f46e5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="5" fill="#10b981" class="badge-pulse"/>
    <text x="32" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">
      FULL-STACK &amp; AI SYSTEMS ARCHITECT
    </text>
  </g>

  <!-- Main Engineer Name -->
  <text x="460" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#glow-text)" letter-spacing="2">
    NGUYEN QUOC HAO
  </text>

  <!-- Subtitle Tagline -->
  <text x="460" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="0.8">
    Autonomous AI Agents • High-Throughput Backends • Distributed Systems
  </text>

  <!-- Tech Badges Bar -->
  <g transform="translate(145, 178)">
    <g transform="translate(0, 0)">
      <rect width="88" height="26" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <text x="44" y="17" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="700">Python</text>
    </g>

    <g transform="translate(98, 0)">
      <rect width="105" height="26" rx="7" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
      <text x="52.5" y="17" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="11.5" font-weight="700">TypeScript</text>
    </g>

    <g transform="translate(213, 0)">
      <rect width="68" height="26" rx="7" fill="#1e293b" stroke="#00ADD8" stroke-width="1" opacity="0.9"/>
      <text x="34" y="17" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="700">Go</text>
    </g>

    <g transform="translate(291, 0)">
      <rect width="78" height="26" rx="7" fill="#1e293b" stroke="#f87171" stroke-width="1" opacity="0.9"/>
      <text x="39" y="17" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="11.5" font-weight="700">Rust</text>
    </g>

    <g transform="translate(379, 0)">
      <rect width="88" height="26" rx="7" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.9"/>
      <text x="44" y="17" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="700">Docker</text>
    </g>

    <g transform="translate(477, 0)">
      <rect width="90" height="26" rx="7" fill="#1e293b" stroke="#fbbf24" stroke-width="1" opacity="0.9"/>
      <text x="45" y="17" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11.5" font-weight="700">FastAPI</text>
    </g>

    <g transform="translate(577, 0)">
      <rect width="92" height="26" rx="7" fill="#1e293b" stroke="#c084fc" stroke-width="1" opacity="0.9"/>
      <text x="46" y="17" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="11.5" font-weight="700">Web3/P2P</text>
    </g>
  </g>
</svg>
