<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Flowing Title Gradient with Animation -->
    <linearGradient id="glow-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#ec4899;#38bdf8" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#ec4899;#38bdf8;#818cf8" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#38bdf8;#a855f7;#f472b6" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#ec4899;#10b981;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#ec4899;#3b82f6;#8b5cf6;#10b981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="sub-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#f9a8d4" />
    </linearGradient>
  </defs>

  <style>
    .star { animation: twinkle 3.5s infinite ease-in-out; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.4); }
    }
    .badge-pulse { animation: breathe 2s infinite ease-in-out; }
    @keyframes breathe {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #10b981); }
    }
    .scan-beam { animation: scan 8s infinite linear; }
    @keyframes scan {
      0% { transform: translateX(-120px); opacity: 0; }
      15% { opacity: 0.35; }
      85% { opacity: 0.35; }
      100% { transform: translateX(1060px); opacity: 0; }
    }
  </style>

  <!-- Base Card -->
  <rect width="938" height="258" x="1" y="1" rx="20" fill="url(#bg)" stroke="url(#border-glow)" stroke-width="2"/>

  <!-- Scanning Beam Effect -->
  <g class="scan-beam">
    <rect x="0" y="2" width="90" height="256" fill="url(#glow-text)" opacity="0.08" transform="skewX(-25)"/>
  </g>

  <!-- Constellation Tech Particles -->
  <g fill="#93c5fd">
    <circle cx="50" cy="50" r="2" class="star" style="animation-delay: 0s;"/>
    <circle cx="100" cy="40" r="1.5" class="star" style="animation-delay: 0.8s;"/>
    <circle cx="150" cy="65" r="2.5" class="star" style="animation-delay: 1.6s;"/>
    <circle cx="70" cy="110" r="1.5" class="star" style="animation-delay: 2.2s;"/>
    <circle cx="130" cy="130" r="2" class="star" style="animation-delay: 1.1s;"/>
    
    <circle cx="890" cy="50" r="2" class="star" style="animation-delay: 0.5s;"/>
    <circle cx="840" cy="40" r="1.5" class="star" style="animation-delay: 1.3s;"/>
    <circle cx="790" cy="70" r="2.5" class="star" style="animation-delay: 2.1s;"/>
    <circle cx="860" cy="115" r="1.5" class="star" style="animation-delay: 0.9s;"/>
    <circle cx="810" cy="140" r="2" class="star" style="animation-delay: 1.7s;"/>
  </g>

  <!-- Network Connectors -->
  <path d="M 50 50 L 100 40 L 150 65 M 70 110 L 130 130" stroke="#38bdf8" stroke-width="0.8" opacity="0.25"/>
  <path d="M 890 50 L 840 40 L 790 70 M 860 115 L 810 140" stroke="#a855f7" stroke-width="0.8" opacity="0.25"/>

  <!-- Status Capsule Badge -->
  <g transform="translate(285, 26)">
    <rect width="370" height="30" rx="15" fill="#0f172a" stroke="#4f46e5" stroke-width="1.2"/>
    <circle cx="20" cy="15" r="5" fill="#10b981" class="badge-pulse"/>
    <text x="35" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">
      FULL-STACK &amp; AI SYSTEMS ARCHITECT
    </text>
  </g>

  <!-- Main Engineer Name -->
  <text x="470" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#glow-text)" letter-spacing="2.5">
    NGUYEN QUOC HAO
  </text>

  <!-- Core Subtitle / Engineering Domains -->
  <text x="470" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="url(#sub-glow)" letter-spacing="1">
    Autonomous AI Multi-Agents  •  High-Concurrency Systems  •  Cloud-Native Architecture
  </text>

  <!-- Technology Chip Badges -->
  <g transform="translate(145, 195)">
    <g transform="translate(0, 0)">
      <rect width="80" height="28" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.95"/>
      <text x="40" y="18" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">Python</text>
    </g>

    <g transform="translate(90, 0)">
      <rect width="98" height="28" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.95"/>
      <text x="49" y="18" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="12" font-weight="700">TypeScript</text>
    </g>

    <g transform="translate(198, 0)">
      <rect width="70" height="28" rx="8" fill="#1e293b" stroke="#00add8" stroke-width="1" opacity="0.95"/>
      <text x="35" y="18" text-anchor="middle" fill="#00add8" font-family="monospace" font-size="12" font-weight="700">Go</text>
    </g>

    <g transform="translate(278, 0)">
      <rect width="70" height="28" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1" opacity="0.95"/>
      <text x="35" y="18" text-anchor="middle" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="700">Rust</text>
    </g>

    <g transform="translate(358, 0)">
      <rect width="84" height="28" rx="8" fill="#1e293b" stroke="#009688" stroke-width="1" opacity="0.95"/>
      <text x="42" y="18" text-anchor="middle" fill="#009688" font-family="monospace" font-size="12" font-weight="700">FastAPI</text>
    </g>

    <g transform="translate(452, 0)">
      <rect width="88" height="28" rx="8" fill="#1e293b" stroke="#61dafb" stroke-width="1" opacity="0.95"/>
      <text x="44" y="18" text-anchor="middle" fill="#61dafb" font-family="monospace" font-size="12" font-weight="700">React 19</text>
    </g>

    <g transform="translate(550, 0)">
      <rect width="100" height="28" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" opacity="0.95"/>
      <text x="50" y="18" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="12" font-weight="700">AI Agents</text>
    </g>
  </g>
</svg>
