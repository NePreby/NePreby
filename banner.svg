<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="16" fill="url(#bg-grad)" stroke="#374151" stroke-width="1.5"/>

  <!-- Decorative Tech Dots / Grid Pattern -->
  <g opacity="0.12" fill="#93c5fd">
    <circle cx="40" cy="40" r="2"/><circle cx="80" cy="40" r="2"/><circle cx="120" cy="40" r="2"/>
    <circle cx="40" cy="80" r="2"/><circle cx="80" cy="80" r="2"/><circle cx="120" cy="80" r="2"/>
    <circle cx="40" cy="120" r="2"/><circle cx="80" cy="120" r="2"/><circle cx="120" cy="120" r="2"/>
    <circle cx="860" cy="40" r="2"/><circle cx="820" cy="40" r="2"/><circle cx="780" cy="40" r="2"/>
    <circle cx="860" cy="80" r="2"/><circle cx="820" cy="80" r="2"/><circle cx="780" cy="80" r="2"/>
    <circle cx="860" cy="120" r="2"/><circle cx="820" cy="120" r="2"/><circle cx="780" cy="120" r="2"/>
  </g>

  <!-- Top Status Badge -->
  <g transform="translate(300, 26)">
    <rect width="300" height="26" rx="13" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
    <circle cx="15" cy="13" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">
      FULL-STACK &amp; AI SYSTEMS ENGINEER
    </text>
  </g>

  <!-- Main Name Title -->
  <text x="450" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="40" font-weight="800" fill="url(#text-grad)" letter-spacing="1.5">
    NGUYỄN QUỐC HẢO
  </text>

  <!-- Subtitle -->
  <text x="450" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    Distributed Architectures • Autonomous Agents • Open-Source Contributor
  </text>

  <!-- Tech Pills Bar at Bottom -->
  <g transform="translate(170, 168)">
    <rect x="0" y="0" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="42.5" y="16" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="600">Python</text>

    <rect x="95" y="0" width="100" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="145" y="16" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="600">TypeScript</text>

    <rect x="205" y="0" width="70" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="240" y="16" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">Go</text>

    <rect x="285" y="0" width="75" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="322.5" y="16" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="11" font-weight="600">Rust</text>

    <rect x="370" y="0" width="85" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="412.5" y="16" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="600">Docker</text>

    <rect x="465" y="0" width="95" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="512.5" y="16" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="600">FastAPI</text>
  </g>
</svg>
